name: Verify
on:
  pull_request:
  merge_group:
    branches:
      - main
  # Callable so the release pipeline runs the exact same checks on the exact
  # commit it is about to publish, rather than trusting that a PR was green.
  workflow_call:

# Each job declares only what it needs; this default-denies anything added later.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # Full history, so the scan also covers earlier commits.
          fetch-depth: 0

      # The gitleaks binary is used directly rather than gitleaks-action, which
      # requires a paid licence for organisation-owned repositories. Rules come
      # from .gitleaks.toml, which extends the default ruleset.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Only the commits this run introduces are scanned. A full-history scan
      # would fail on pre-existing findings unrelated to the change, and takes
      # over a minute. Run `gitleaks git` locally for a full audit.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            RANGE="$BASE_SHA..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Scanning $RANGE"
          gitleaks git --redact -v --exit-code 1 --log-opts="$RANGE"

  verify:
    name: pnpm build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=14366

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.16.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit

      - name: sherif
        run: pnpm check:repo

      - name: Code check (Biome)
        run: pnpm biome check

      # Builds the workspace packages that the SDK's types resolve against.
      - name: Build project
        run: pnpm build

      - name: Check TypeScript types
        run: pnpm check:types

      # Coverage is measured and published rather than gated. Thresholds can be
      # introduced per directory as coverage grows.
      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: sdk/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check for unused files, dependencies, and exports
        run: pnpm knip --production

      - name: Verify package exports
        run: pnpm test:build

      # publint and attw verify that the entry point resolves. This compiles a
      # consumer project against the built .d.ts with skipLibCheck disabled, so
      # imports inside the shipped declarations are checked too.
      - name: Type-check built package as a consumer
        run: pnpm test:env

      # Keeps the generated reference documentation buildable.
      - name: Build API documentation
        run: pnpm build:docs

      - name: Bundle size budget
        run: pnpm size
