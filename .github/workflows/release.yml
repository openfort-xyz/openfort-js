name: Release

on:
  push:
    branches: [main]

# Each job declares only what it needs; this default-denies anything added later.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Releases are never cancelled. changesets publishes package-by-package and
  # then creates tags and GitHub releases; cancelling between those steps would
  # leave npm and the repository out of sync.
  cancel-in-progress: false

jobs:
  # Run the full PR pipeline against this exact commit before publishing.
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  release:
    name: Create version pull request and github release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this environment with required reviewers to add a manual
    # approval before publishing, and to scope the npm trusted-publisher OIDC
    # subject to the environment rather than the whole repository.
    environment: npm
    permissions:
      contents: write       # To push commits and tags
      pull-requests: write  # To create and update PRs
      id-token: write       # For OIDC and provenance

    steps:
      # persist-credentials stays on: changesets/action pushes the version branch.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.16.1

      # No dependency cache on the publishing job: the store is resolved from
      # the lockfile instead. Costs roughly 30s on an infrequent job.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          commit: "chore: version package" # Default is `Version Packages`
          title: "chore: version package"  # Default is `Version Packages`
        env:
          NPM_CONFIG_PROVENANCE: true # this works only with npmjs and public repos, not ghcr
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # we need this for PRs
          NPM_TOKEN: '' # bug in changesets/action - https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
