  "hono": ">=4.12.34"
  "react-router@<7.18.0": ">=7.18.0 <8"
  "lodash@>=4.0.0 <=4.17.23": ">=4.18.0"
  "next": ">=16.2.11"
  "fast-xml-parser": ">=5.7.0"
  "axios": ">=1.18.0"
  "minimatch": ">=10.2.3"
  "bn.js": ">=5.2.3"
  "rollup@>=4.0.0 <4.59.0": ">=4.59.0"
  "serialize-javascript@<7.0.5": ">=7.0.5"
