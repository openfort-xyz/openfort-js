auditConfig:
  # elliptic@6.6.1 has no upstream fix; remove after dropping @ethersproject/*.
  ignoreCves:
    - "CVE-2025-14505"
  # Dev/example-only react-router issue; remove after moving vite-wagmi to react-router-dom 8.
  ignoreGhsas:
    - "GHSA-qwww-vcr4-c8h2"
    # braces <=3.0.3 has no patched release; dev tooling only (micromatch).
    - "GHSA-vfj7-8cjw-p6xm"
    # node-forge <=1.4.0 has no patched release; firebase-next-app example only.
    - "GHSA-86w9-cpqp-85rv"
    # postcss-selector-parser has no patched 6.x and tailwindcss 3 needs ^6; example apps only.
    - "GHSA-rj75-hqrm-r3gf"
    # axios <1.20.0. The fix is axios 1.20.0 (#383), which fails the generated client's
    # declaration emit (TS2527 in openapi-clients common.ts). Remove once that lands.
    - "GHSA-vh66-26gq-q6x8"
    - "GHSA-9fr6-4gfg-395g"
    - "GHSA-c29m-xwm3-cm6r"
    - "GHSA-mghh-pgcx-3jjj"
    - "GHSA-x97p-jq2g-jp4f"
    - "GHSA-3pq3-5fj3-cg6v"
    - "GHSA-542g-h47m-68v8"
    - "GHSA-j8rh-479h-cp32"
    - "GHSA-4hqw-qxg8-jxx2"
    - "GHSA-m8m8-qj5v-23w3"
    - "GHSA-44g4-m2mj-wpvx"
    - "GHSA-r4gj-5m52-g5wh"
onlyBuiltDependencies:
